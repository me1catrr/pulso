name: publication-guard

# Idéntico en pulso-quarto y pulso. Solo comprueba: no despliega nada.
# La lista privada de términos vetados no existe en CI; aquí actúan los
# patrones genéricos y gitleaks.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Guardián de publicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pruebas del guardián
        run: bash scripts/test-check-publication.sh

      - name: Archivos versionados e historial completo
        run: bash scripts/check-publication.sh --tracked --history

      - name: Gitleaks (secretos en todo el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
